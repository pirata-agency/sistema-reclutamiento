<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pirata Agency | Reclutamiento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Únete a Pirata Agency</h1>
    <p>Gana dinero transmitiendo en vivo desde casa</p>

    <form 
      action="https://script.google.com/macros/s/AKfycbx8G8KvxxkOvP2FyCDBOAMr1kzUyGTgoaRUPTdePO8BBE2MwrwhOju9V0jAeqH0qBmq/exec"
      method="POST"
      target="hidden_iframe"
      onsubmit="mostrarMensaje()"
    >
    
      <input type="text" name="nombre" placeholder="Nombre completo" required>
      <input type="number" name="edad" placeholder="Edad" required>
      <input type="text" name="pais" placeholder="País" required>
      <input type="text" name="telefono" placeholder="WhatsApp" required>
    
      <select name="fuente" required>
        <option value="">¿Dónde nos encontraste?</option>
        <option value="TikTok">TikTok</option>
        <option value="Facebook">Facebook</option>
        <option value="Instagram">Instagram</option>
        <option value="Otro">Otro</option>
      </select>
    
      <select name="puntaje" required>
        <option value="10">1 hora</option>
        <option value="20">2-3 horas</option>
        <option value="30">4 o más horas</option>
      </select>
    
      <button type="submit">Postularme</button>
    </form>
    
    <iframe name="hidden_iframe" style="display:none;"></iframe>
    
    <div id="mensaje"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
